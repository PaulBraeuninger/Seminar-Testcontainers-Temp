name: Development Workflow

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ vars.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Analyze code with ruff
        run: uv run ruff check src tests

      - name: Analyze code with ty
        run: uv run ty check src tests/integration tests/testcontainers

  testcontainers:
    name: Testcontainers – ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        service: [keycloak, mailpit, postgres]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ vars.UV_VERSION }}

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: >-
          uv run --locked pytest
          tests/testcontainers
          -m "${{ matrix.service }} and not workflow"
          -v

      - name: Run tests without containers
        if: matrix.service == 'keycloak'
        run: >-
          uv run --locked pytest
          tests/testcontainers
          -m "not (postgres or keycloak or mailpit or workflow)"
          -v
